[package]
name = "yom"
description = "A modern, easy to install competitor to the dash shell, built solely to execute files."
license = "MIT"
version = "0.1.5"
edition = "2024"
repository = "https://github.com/G0o53/yom"

keywords = ["shell", "boot", "script", "initramfs", "unix"]
categories = ["command-line-utilities", "os::linux-apis"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
shell-words = "1.1.1"
