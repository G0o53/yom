[package]
name = "yom"
description = "A modern, easy to install competitor to the dash shell, built solely to execute files."
license = "GPL-2.0-only"
version = "2.2.7"
readme = "README.md"
edition = "2024"
repository = "https://github.com/G0o53/yom"

keywords = ["shell", "boot", "script", "initramfs", "unix"]
categories = ["command-line-utilities", "os::linux-apis"]
rust-version = "1.85.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
shell-words = { version = "1.1.1", default-features = false }
home = { version = "0.5", default-features = false }
