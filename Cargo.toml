[package]
name = "yom"
description = "A modern, easy to install competitor to the dash shell, built solely to execute files."
license = "MIT"
version = "0.0.3"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
shell-words = "1.1.1"
